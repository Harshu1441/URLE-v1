# ULRE Production Logging Configuration (log.conf)
# Place alongside binary or pass via --log-config /path/to/log.conf

# Prefix for per-run log directories: <log_base_dir>/<log_dir_prefix>-YYYY-MM-DD_HH-MM-SS/
log_base_dir=./logs
log_dir_prefix=server_log
log_file_name=ulre-server.log

# Rotate active log file once it reaches max_size_mb (default: 500 MB)
max_size_mb=500

# Maximum number of rotated archive files to retain inside the log directory
max_files=10

# Minimum log level: DEBUG | INFO | WARN | ERROR
level=INFO

# Also mirror logs to standard output
also_stdout=true
